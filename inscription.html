<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>inscription</title>
  <link rel="stylesheet" href="inscription.css" />
</head>
<body>
  <main class="page">
    <!-- IMAGE-->
    <div class="bg"></div>
    <div class="bg-overlay" aria-hidden="true"></div>
      <! -- FORMULAIRE -- >
    <section class="card" aria-labelledby="login-title">
      <h1 id="login-title" class="card-title">S'INSCRIRE</h1>
      <p class="card-subtitle">Bienvenue a AUTO.CI</p>

      <form class="form" action="#" method="post" novalidate>
        <div class="field">
          <label for="NOM" class="label">NOM</label>
          <input type="text" id=""name="NOM"placeholder="Entrer votre nom"autocomplete="NOM"required/>
        </div>

        <div class="field">
          <label for="PRENOM" class="label">PRENOM</label>
          <input type="text" id=""name="PRENOM"placeholder="Entrer votre prenom"autocomplete="PRENOM"required/>
        </div>

        <div class="field">
          <label for="password" class="label">MOTS DE PASSE</label>
          <input type="password" name="password" placeholder="Entrer votre mots de passe" autocomplete="password" required/>
        </div>

        <button type="submit" class="btn">S'inscrire</button>

        
    </section>
  </main>
</body>
</html>
